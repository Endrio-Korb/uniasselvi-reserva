{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container-flex-column">
        <p class="text text-center">{{erro}}</p>
        <form  action="{% url 'usuarios:login_user' %}" method="POST"> {% csrf_token %}
            <div class="container">
                <label class='text text-center' for='username'>Nome de usuario</label>
                <input type="text" id="username" name="username" class="input" placeholder="Digite seu usuário">
                <label class='text text-center' for='password'>Senha</label>
                <input type="password" id="password" name="password" class="input" placeholder="Digite sua senha">
                <button type="submit" class="btn">Enviar</button>
            </div>
        </form>
        {% comment %} <div>
            <a href="{% url 'usuarios:pre_registro' %}">Não tenho cadastro</a>
        </div> {% endcomment %}
        <div class="container">
            <button>
                <a href="{% url 'password_reset' %}">Recuperar senha</a>
            </button>
        </div>
    </div>
    

{% endblock content %}
